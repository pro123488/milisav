<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tablero de créditos · HomeBridge</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <!-- Vista previa sin instalación: carga React, lucide-react y Tailwind desde CDN y compila DashboardCreditos.jsx en el navegador. -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
        "lucide-react": "https://esm.sh/lucide-react@0.454.0?deps=react@18.3.1"
      }
    }
  </script>
</head>
<body class="bg-slate-100">
  <div id="root"><p style="font-family:system-ui;padding:2rem;color:#64748b">Cargando tablero…</p></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';

    const root = document.getElementById('root');
    try {
      const source = await (await fetch('DashboardCreditos.jsx')).text();
      const { code } = Babel.transform(source, { presets: ['react'], filename: 'DashboardCreditos.jsx' });
      const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      const { default: DashboardCreditos } = await import(url);
      createRoot(root).render(React.createElement(React.StrictMode, null, React.createElement(DashboardCreditos)));
    } catch (err) {
      root.innerHTML = '<p style="font-family:system-ui;padding:2rem;color:#be123c">No se pudo cargar el tablero. Ábrelo desde un servidor web (por ejemplo GitHub Pages), no con doble clic.</p>';
      console.error(err);
    }
  </script>
</body>
</html>

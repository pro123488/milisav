<script>
(function () {
  "use strict";

  // "Pausar animaciones" (botón del pie): avisa a todas las partes de la página.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (d && d.bosch === "movimiento") {
      if (d.pausar) document.documentElement.setAttribute("data-movimiento", "still");
      else document.documentElement.removeAttribute("data-movimiento");
    }
  });
})();
</script>
